<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Rastrillo</title>
  <link rel="preload" href="/static/fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/app.css?v={{ version_estaticos }}">
</head>
<body>
<main class="login-pagina">
  <div class="login-tarjeta">
    <h1 class="login-marca">Rastrillo</h1>
    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="login-email">Email</label>
        <input id="login-email" type="email" name="email" class="form-control" required autofocus autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label" for="login-password">Contraseña</label>
        <input id="login-password" type="password" name="password" class="form-control" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
    <p class="login-pie">Fuente: Dirección ChileCompra</p>
  </div>
</main>
</body>
</html>
