{# Producto + formato de una línea (F-plat-1). Contexto: `linea_id`, `productos` (id, nombre), `producto_sel`, `formatos`, `formato_sel`. #}
<div class="d-flex flex-wrap gap-1">
  <select name="producto_id" class="form-select form-select-sm w-auto" required aria-label="Producto"
          hx-get="/catalogo/formatos?linea_id={{ linea_id }}" hx-trigger="change" hx-target="#fmt-{{ linea_id }}" hx-swap="innerHTML">
    {% if not productos %}<option value="">Sin resultados: busca otro nombre</option>{% endif %}
    {% for p in productos %}
    <option value="{{ p.id }}" {% if p.id == producto_sel %}selected{% endif %}>{{ p.nombre }}</option>
    {% endfor %}
  </select>
  <span id="fmt-{{ linea_id }}">{% include "_catalogo_formatos.html" %}</span>
</div>
