{#- Íconos de la barra lateral (F-plat-ui): SVG inline de trazo 1,5 px, sin librería.
    Uso: {% from "_iconos.html" import icono %}{{ icono("catalogo") }} -#}
{% macro icono(nombre) -%}
<svg class="icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

  <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>

{%- elif nombre == "salud" -%}

  <rect x="3" y="4" width="18" height="4.5" rx="1"/><path d="M5 8.5V20h14V8.5"/><path d="M10 12.5h4"/>
