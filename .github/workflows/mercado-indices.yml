# Mercado índices (F-plat-4): comuna de las CA, índice de precios por producto × ámbito × mes,
# evaluación walk-forward del último mes cerrado y reentrenamiento del modelo de P(ganar). Después,
# `mercado-competencia` (F-plat-comp): agregado de competencia de los 2 últimos meses y sus jueces.
# Al final, `mercado-demanda` (F-plat-6): series de demanda de los 3 últimos meses, backtest,
# pronósticos a 3 meses y recomendaciones de abastecimiento (usa las desiertas de competencia).
# Solo base de datos: sin ticket, sin cuota, sin API.
#
# Disparo: desde cron-job.org, una vez al día a las 07:45 hora de Chile (workflow_dispatch),
# después de `mercado-oc` (07:20). Documentado en docs/operacion-disparos.md. Sin `schedule`.
# Choca con el `mercado` de las 07:45 (mismo advisory lock): espera el lock hasta 10 min. Si la
# corrida pasa de ~10 min, los `mercado` que caigan en medio salen `omitido` (aceptado una vez al
# día).
#
# Carga completa (F-plat-6-fix): Actions → mercado-indices → Run workflow → marcar `completo` →
# Run (de día, sin migración pendiente). Pasa `--completo` a los tres jobs y sube el timeout a
# 180 min. cron-job.org dispara sin inputs: `completo` queda en false y la corrida diaria no
# cambia. Desde el PC es mucho más lenta (un viaje Chile → Neon us-east por sentencia).
name: mercado-indices

on:
  workflow_dispatch:
    inputs:
      completo:
        description: "Carga completa (--completo en los tres jobs; timeout 180 min)"
        type: boolean
        required: false
        default: false

concurrency:
  group: mp-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    with:
      jobs: "mercado-indices mercado-competencia mercado-demanda"
      # mercado-indices: 10 de espera del lock + índice de 3 meses + evaluación y dos entrenamientos
      # en Python puro. mercado-competencia (F-plat-comp): 1 min de pausa entre jobs + hasta 10 de
      # espera del lock (lo puede tomar el `mercado` de las 08:00) + recálculo de 2 meses, juez y
      # aporte al modelo (medido en docs/operacion-disparos.md). mercado-demanda (F-plat-6): otra
      # pausa de 1 min + hasta 10 de espera del lock + una pasada liviana por las OC, 3 meses de
      # series, backtest de 6 meses en Python puro y recomendaciones. Medido en dev el 5-nov (solo
      # OC, 108 mil líneas): ~1 min de lectura + 11 s de backtest. Ajustar con la corrida real.
      # Con `completo`: 180 (los tres recálculos completos; medir en la primera corrida).
      timeout_min: ${{ inputs.completo && 180 || 60 }}
      esperar_lock_min: 10
      completo: ${{ inputs.completo == true }}
