# Canario de F-actions: ciclo de Compra Ágil disparado a mano. Los horarios
# (`schedule`) entran en F-actions-2, una vez verificado que conecta a Neon.
name: ciclo-ca

on:
  workflow_dispatch:

# El advisory lock es una llave global: dos workflows simultáneos harían que
# uno se omita en silencio. Se encolan en vez de cancelarse.
concurrency:
  group: mp-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    with:
      jobs: "ca match alerts detalles-match"
      # ca (~40 min) + match (~2) + alerts + detalles-match (tope 20 + un detalle
      # en curso) + 3 pausas de 60 s entre jobs ≈ 70 min: 90 deja margen.
      timeout_min: 90
