# Ciclo nocturno: datos abiertos, estados vencidos, lifecycle, competencia, backfill de ayer y
# detalles-match con el presupuesto de noche (F-actions-2).
#
# Disparo (F-actions-3): desde cron-job.org, hora de Chile, a las 01:10, con la API
# de GitHub (workflow_dispatch). El horario vive en cron-job.org y está documentado
# en docs/operacion-disparos.md. Sin `schedule` a propósito: un disparo doble
# gastaría cuota de la API.
# 01:10 cae dentro de 22:00–07:00; de todos modos `_ciclo_nocturno` valida la
# ventana en código con America/Santiago (regla 5) y no hace nada si cae fuera.
# Puede tener el lock ~3 h: por eso retencion (05:40) y catalogos (06:35) van después.
name: nocturno

on:
  workflow_dispatch:

concurrency:
  group: mp-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    with:
      jobs: "nocturno"
      # Paso 0: datos-abiertos 1,9 min, lifecycle 2,1, competencia 0,0; backfill de
      # ayer SIN medir. detalles-match: 120 (DETALLES_MINUTOS_NOCHE) + ~2 de un
      # detalle en curso. ≈ 126 + backfill, + 30 de espera = 156 + backfill.
      # estados-vencidos (F-estados-vencidos): ~1,2 min de leer 4 meses de lic-da
      # (medido local, 24-sep) + hasta 150 detalles v1 a ~1,3 s (lifecycle) ≈ 5.
      # 220 le deja ~55 min al backfill. Un solo proceso: sin pausas entre pasos.
      timeout_min: 220
      esperar_lock_min: 30
