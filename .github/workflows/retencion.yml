# Retención: purga de terminales > 90 días (regla 11), diaria (F-actions-2).
#
# Disparo (F-actions-3): desde cron-job.org, hora de Chile, a las 05:40, con la API
# de GitHub (workflow_dispatch). El horario vive en cron-job.org y está documentado
# en docs/operacion-disparos.md. Sin `schedule` a propósito (evita disparos dobles).
# Va después de `nocturno` (01:10), que puede tener el lock ~3 h.
name: retencion

on:
  workflow_dispatch:

concurrency:
  group: mp-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    with:
      jobs: "retencion"
      # Paso 0: 0,0 min. 30 de espera + margen.
      timeout_min: 45
      esperar_lock_min: 30
