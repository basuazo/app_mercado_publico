# Match + alertas inmediatas + detalles de lo que matcheó, cada 2 h de día (F-actions-2).
# Usa lo que dejó el `ca` de la hora (ca.yml) y lo último de ciclo-activas.
#
# Horario escalonado: ningún par minuto/hora UTC se repite entre workflows (`ca`
# ocupa el :05 de todas las horas). Acá: :50 de 11, 13, …, 23 UTC.
# Cron en UTC: con Chile en UTC−3 corre 08:50 → 20:50; cuando pasa a UTC−4 se
# corre 1 h antes (07:50 → 19:50). Aceptado.
name: ciclo-match

on:
  schedule:
    - cron: "50 11,13,15,17,19,21,23 * * *"
  workflow_dispatch:

concurrency:
  group: mp-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    with:
      jobs: "match alerts detalles-match"
      # Paso 0: match ≤ 1,6 min, alerts ≤ 0,1, detalles-match 20,1 (tope de 20 +
      # un detalle en curso) + 2 pausas de 60 s ≈ 25 min de trabajo. La espera de
      # 25 min puede tocar a más de un job de la lista (entre job y job otro
      # workflow puede quedarse con el lock): 75 en vez de 60.
      timeout_min: 75
      esperar_lock_min: 25
