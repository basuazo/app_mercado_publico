# Resumen diario por correo, a las 08:30 hora Chile (F-actions-2).
#
# Disparo (F-actions-3): desde cron-job.org, hora de Chile, a las 08:30, con la API
# de GitHub (workflow_dispatch). El horario vive en cron-job.org y está documentado
# en docs/operacion-disparos.md. Sin `schedule` a propósito: un disparo doble
# mandaría dos correos. Sin guardia de hora: cron-job.org dispara a la hora exacta
# (y con workflow_dispatch el guardia de _job.yml se salta igual).
# OJO: el horario está amarrado a DIGEST_HOUR=8. Si alguien cambia DIGEST_HOUR,
# hay que mover el cron en cron-job.org.
#
# `resumen` no usa la API, pero toma el mismo advisory lock que todos. A las
# 08:30 casi siempre encuentra corriendo el `ca` de las 08:05 (hasta ~40 min):
# por eso espera hasta 45 min y el correo llega entre 08:30 y ~08:50. Aceptado;
# no se cambia la semántica del lock para evitarlo.
name: resumen

on:
  workflow_dispatch:

concurrency:
  group: mp-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    with:
      jobs: "resumen"
      # Paso 0: 0,0 min. 45 de espera + margen.
      timeout_min: 60
      esperar_lock_min: 45
