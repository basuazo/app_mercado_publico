# Catálogos (organismos), semanal los lunes (F-actions-2).
#
# 09:35 UTC = lunes 06:35 Chile en UTC−3, dentro de 22:00–07:00; con UTC−4 cae
# 05:35 (el corrimiento se acepta). Va después de `nocturno` y de `retencion`.
# Horario escalonado: ningún par minuto/hora UTC se repite entre workflows (`ca`
# ocupa el :05 de todas las horas).
name: catalogos

on:
  schedule:
    - cron: "35 9 * * 1"
  workflow_dispatch:

concurrency:
  group: mp-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    with:
      jobs: "catalogos"
      # Paso 0: 0,0 min. 30 de espera + margen.
      timeout_min: 45
      esperar_lock_min: 30
