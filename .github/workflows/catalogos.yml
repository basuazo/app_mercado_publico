# Catálogos (organismos) + Plan Anual completo (F-plan-busqueda) + vocabulario por
# rubro (F-ca-explorar), semanal los lunes.
#
# Disparo (F-actions-3): desde cron-job.org, hora de Chile, los lunes a las 06:35
# (dentro de 22:00–07:00), con la API de GitHub (workflow_dispatch). El horario vive
# en cron-job.org y está documentado en docs/operacion-disparos.md. Sin `schedule`
# a propósito (evita disparos dobles). Va después de `nocturno` y de `retencion`.
name: catalogos

on:
  workflow_dispatch:

concurrency:
  group: mp-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    with:
      jobs: "catalogos plan-anual vocabulario-rubros"
      # catalogos: 0,0 min medido. plan-anual: sin medir en producción todavía
      # (Paso 0 lo corre Boris, ver docs/prompt-F-plan-busqueda.md) — 60 min es
      # margen provisorio sobre una estimación local (~7 MB, 300k filas en
      # lotes de 5000); ajustar con el tiempo real de la primera corrida.
      # vocabulario-rubros: una sola sentencia agregada en Postgres sobre ~114k ítems y los
      # nombres de CA de 30 días; sin medir en producción, cabe en el margen de arriba.
      timeout_min: 75
      esperar_lock_min: 30
